<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#f2f6fc">
<title>(𝑪ꫝꪮꪊ𝓓 ꫝꪖ𝘳ꪗ  ꪮ𝑓𝑓𝑖ᥴ𝑖ꪖ𝑙 🂱 ) — NTPC GK PYQ TEST-04</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{margin:0;padding:0}
:root{
--paper:#f2f6fc;--paper-2:#e8f0fd;--card:#fff;--ink:#0b1f3b;--ink-2:#3e5775;--ink-3:#7a90ae;
--line:#e2ecf9;--line-2:#c9dbf5;--accent:#1d6cf0;--accent-2:#1a4fbf;--accent-soft:#d6e6ff;
--green:#15803d;--green-soft:#dcfce7;--red:#dc2626;--red-soft:#fee2e2;--yellow-soft:#fef3c7;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);
min-height:100dvh;font-size:15px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
overflow-x:hidden;background-image:radial-gradient(circle at 15% 5%,rgba(29,108,240,.06),transparent 40%),
radial-gradient(circle at 85% 95%,rgba(26,79,191,.05),transparent 45%);background-attachment:fixed}
.serif{font-family:'Fraunces',ui-serif,Georgia,serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
a{color:inherit;text-decoration:none}

/* ===== GATE ===== */
.gate{position:fixed;inset:0;background:rgba(11,31,59,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.gate-card{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:32px 24px 28px;
box-shadow:0 24px 60px -16px rgba(11,31,59,.35);text-align:center;position:relative;overflow:hidden}

.wa-logo-icon{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;position:relative;
overflow:hidden;box-shadow:0 8px 20px rgba(29,108,240,.25);border:3px solid #fff}
.wa-logo-icon img{width:100%;height:100%;object-fit:cover;display:block}
.btn-later{display:block;width:100%;text-align:center;background:none;border:none;color:var(--ink-3);
font-weight:600;font-size:13px;padding:12px 8px 2px;cursor:pointer;transition:color .15s}
.btn-later:hover{color:var(--ink-2)}
.gate-title{font-family:'Inter',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:12px;position:relative;color:var(--ink)}
.gate-title em{font-style:normal;color:var(--ink)}
.gate-sub{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:22px;position:relative}
.gate-steps{display:flex;flex-direction:column;gap:11px;text-align:left;background:var(--paper);border-radius:14px;
padding:16px;margin-bottom:20px;position:relative}
.gate-step{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--ink);line-height:1.5;font-weight:500}
.gate-step-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);
display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:1px}
.btn-join-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;
background:#25d366;color:#fff;border-radius:14px;font-size:14px;font-weight:600;text-decoration:none;
margin-bottom:10px;transition:all .2s;position:relative}
.btn-join-wa:hover{background:#1eb955;transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(37,211,102,.5)}
.btn-join-wa i{font-size:20px}
.btn-start-quiz{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;
background:var(--ink);color:var(--card);border-radius:14px;font-size:14px;font-weight:600;transition:all .2s;position:relative}
.btn-start-quiz:hover:not(:disabled){background:#000;transform:translateY(-1px)}
.btn-start-quiz:disabled{background:var(--line-2);cursor:not-allowed;opacity:.7}
.gate-foot{margin-top:16px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);position:relative}
.gate-foot a{color:var(--accent);font-weight:700}

/* Mode select */
.mode-title{font-family:'Fraunces',serif;font-size:28px;font-weight:400;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px;position:relative}
.mode-title em{font-style:italic;color:var(--accent)}
.mode-sub{font-size:13px;color:var(--ink-2);margin-bottom:22px;position:relative}
.mode-btn{display:flex;align-items:flex-start;gap:14px;width:100%;padding:18px;background:var(--card);
border:1.5px solid var(--line);border-radius:16px;text-align:left;margin-bottom:11px;transition:all .18s;position:relative}
.mode-btn:hover{border-color:var(--accent);background:var(--paper);transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(29,108,240,.25)}
.mode-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
font-size:19px;flex-shrink:0}
.mode-icon.quiz{background:var(--accent-soft);color:var(--accent)}
.mode-icon.test{background:var(--green-soft);color:var(--green)}
.mode-info{flex:1;min-width:0}
.mode-name{font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin-bottom:3px}
.mode-desc{font-size:12px;color:var(--ink-2);line-height:1.45}
.mode-arrow{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--paper);color:var(--ink-2);
display:flex;align-items:center;justify-content:center;font-size:11px;align-self:center;transition:all .2s}
.mode-btn:hover .mode-arrow{background:var(--accent);color:#fff;transform:translateX(3px)}

/* ===== QUIZ APP ===== */
.quiz-app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.quiz-header{flex-shrink:0;z-index:40;background:rgba(245,241,234,.92);
backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
border-bottom:1px solid var(--line);padding:12px 14px}
.quiz-header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);
display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;flex-shrink:0}
.hdr-btn:hover{background:var(--paper-2)}
.hdr-brand{display:flex;align-items:center;gap:9px;padding:4px 10px;border-radius:10px;transition:background .15s;min-width:0}
.hdr-brand:hover{background:var(--paper-2)}
.hdr-logo{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--paper);
display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:18px;font-style:italic;
padding-bottom:2px;flex-shrink:0}
.hdr-name{font-weight:700;font-size:14px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-timer{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card);border:1px solid var(--line);
border-radius:999px;font-family:ui-monospace,monospace;font-size:13.5px;font-weight:600;color:var(--ink);
font-variant-numeric:tabular-nums;flex-shrink:0}
.hdr-timer i{color:var(--accent);font-size:11px}

.quiz-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:900px;width:100%;margin:0 auto;padding:20px 14px 24px;scroll-behavior:smooth}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;
box-shadow:0 1px 2px rgba(26,22,19,.03);animation:qIn .3s ease}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.q-num-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;background:var(--accent-soft);
color:var(--accent-2);border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.q-num-badge i{font-size:10px}
.q-lang-toggle{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--paper);
border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2);
transition:all .15s;white-space:nowrap}
.q-lang-toggle:hover{background:var(--card);border-color:var(--ink-3);color:var(--ink);transform:translateY(-1px)}
.q-lang-toggle i{font-size:11px;color:var(--accent)}
.q-text{font-size:15.5px;line-height:1.6;color:var(--ink);margin-bottom:20px;font-weight:500;letter-spacing:-.011em;word-wrap:break-word;overflow-wrap:anywhere}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--paper);border:1.5px solid transparent;
border-radius:14px;cursor:pointer;transition:all .15s;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.opt:hover:not(.locked){background:var(--paper-2)}
.opt.selected{background:var(--accent-soft);border-color:var(--accent)}
.opt.locked{cursor:default}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red-soft);border-color:var(--red);animation:shake .5s}
.opt.wrong .opt-letter{background:var(--red);border-color:var(--red);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opt-letter{width:32px;height:32px;border-radius:50%;background:var(--card);border:1.5px solid var(--line-2);
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-2);
flex-shrink:0;transition:all .15s}
.opt.selected .opt-letter{background:var(--accent);border-color:var(--accent);color:#fff}
.opt-text{flex:1;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere}
.opt-tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
padding:3px 8px;border-radius:6px;background:var(--card);color:var(--ink-2);white-space:nowrap;flex-shrink:0}
.opt.correct .opt-tag{background:var(--green);color:#fff}
.opt.wrong .opt-tag{background:var(--red);color:#fff}

/* Solution box */
.sol-box{margin-top:16px;padding:16px;background:var(--paper);border-left:4px solid var(--accent);
border-radius:12px;animation:solIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes solIn{from{opacity:0;transform:translateY(-6px);max-height:0}to{opacity:1;transform:translateY(0);max-height:600px}}
.sol-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;
text-transform:uppercase;color:var(--accent-2);margin-bottom:10px}
.sol-head i{font-size:13px}
.sol-text{font-size:13.5px;line-height:1.55;color:var(--ink);font-weight:500}
.sol-hi{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2);color:var(--ink-2);font-size:13px}

.quiz-nav{flex-shrink:0;z-index:30;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
background:rgba(245,241,234,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.quiz-nav-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 15px;border-radius:13px;
font-size:13px;font-weight:600;letter-spacing:-.005em;transition:all .15s;flex-shrink:0}
.nav-btn.prev{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.nav-btn.prev:hover:not(:disabled){background:var(--paper-2);color:var(--ink)}
.nav-btn.prev:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.submit{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.nav-btn.submit:hover{background:var(--paper-2)}
.nav-btn.next{background:var(--ink);color:var(--card);min-width:94px}
.nav-btn.next:hover{background:#000;transform:translateY(-1px)}
.nav-btn i{font-size:11px}
.review-progress{padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;
font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* Palette */
.palette-overlay{position:fixed;inset:0;z-index:60;background:rgba(20,16,12,.5);
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;animation:fadeIn .2s ease}
.palette-overlay.open{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.palette{position:fixed;top:0;left:0;bottom:0;width:min(340px,85vw);background:var(--card);z-index:70;
display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,1,.3,1);
box-shadow:0 0 60px rgba(20,16,12,.15)}
.palette.open{transform:translateX(0)}
.palette-head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
justify-content:space-between;gap:12px}
.palette-title{font-family:'Fraunces',serif;font-size:20px;font-weight:400;letter-spacing:-.02em}
.palette-title em{font-style:italic;color:var(--accent)}
.palette-close{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-2);transition:all .15s}
.palette-close:hover{background:var(--paper-2);transform:rotate(90deg)}
.palette-legend{padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:9px;border-bottom:1px solid var(--line);
font-size:11.5px;font-weight:500;color:var(--ink-2)}
.leg-item{display:flex;align-items:center;gap:8px}
.leg-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--line-2)}
.leg-dot.answered{background:var(--green);border-color:var(--green)}
.leg-dot.notans{background:#fecaca;border-color:var(--red)}
.leg-dot.notvis{background:#fff}
.palette-grid{flex:1;overflow-y:auto;padding:18px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-content:start}
.pal-btn{width:100%;aspect-ratio:1;border-radius:11px;background:var(--paper);border:1.5px solid var(--line);
font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .15s;display:flex;align-items:center;justify-content:center}
.pal-btn:hover{transform:scale(1.05)}
.pal-btn.answered{background:var(--green);border-color:var(--green);color:#fff}
.pal-btn.notans{background:#fecaca;border-color:var(--red);color:var(--red)}
.pal-btn.current{box-shadow:0 0 0 3px var(--accent);transform:scale(1.05)}
.palette-stats{padding:14px 20px;border-top:1px solid var(--line);background:var(--paper);font-size:12px;
color:var(--ink-2);display:flex;justify-content:space-between;gap:10px}
.palette-stats strong{color:var(--ink);font-weight:700}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(20,16,12,.55);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;
padding:20px;animation:fadeIn .2s ease;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:28px 22px 22px;
animation:modalIn .3s cubic-bezier(.16,1,.3,1);box-shadow:0 24px 60px -16px rgba(26,22,19,.3);
max-height:calc(100dvh - 40px);overflow-y:auto;margin:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-title{font-family:'Fraunces',serif;font-size:26px;font-weight:400;letter-spacing:-.025em;margin-bottom:14px;text-align:center}
.modal-title em{font-style:italic;color:var(--accent)}
.modal-note{padding:13px 15px;background:var(--yellow-soft);border-radius:12px;font-size:12.5px;color:#78350f;
line-height:1.5;text-align:center;margin-bottom:18px}
.modal-note strong{color:#7c2d12;font-weight:700}
.modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.modal-stat{padding:15px;background:var(--paper);border-radius:12px;text-align:center}
.modal-stat-val{font-family:'Fraunces',serif;font-size:28px;font-weight:400;letter-spacing:-.03em;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.modal-stat-val.green{color:var(--green)}
.modal-stat-val.gray{color:var(--ink-2)}
.modal-stat-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.modal-actions{display:flex;flex-direction:column;gap:10px}
.btn-modal{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 20px;border-radius:14px;
font-size:14px;font-weight:600;transition:all .15s;font-family:inherit}
.btn-modal.yes{background:var(--green);color:#fff}
.btn-modal.yes:hover{background:#166534;transform:translateY(-1px)}
.btn-modal.cancel{background:var(--card);border:1.5px solid var(--line);color:var(--ink-2)}
.btn-modal.cancel:hover{background:var(--paper-2);color:var(--ink)}

/* Results */
.results{position:fixed;inset:0;background:var(--paper);z-index:90;overflow-y:auto;display:none;padding:32px 14px 60px}
.results.open{display:block}
.results-inner{max-width:640px;margin:0 auto}
.results-hero{text-align:center;margin-bottom:26px;animation:itemIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes itemIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.results-tick{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);
display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;
animation:tickPop .5s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes tickPop{from{transform:scale(0)}to{transform:scale(1)}}
.results-title{font-family:'Fraunces',serif;font-size:36px;font-weight:400;letter-spacing:-.035em;margin-bottom:12px}
.results-title em{font-style:italic;color:var(--accent)}
.results-time{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);
border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);
font-family:ui-monospace,monospace}
.results-time i{color:var(--accent)}
.results-score-card{background:var(--ink);color:var(--paper);border-radius:24px;padding:28px 24px;text-align:center;
margin-bottom:18px;position:relative;overflow:hidden}
.results-score-card::before{content:'';position:absolute;top:-60px;right:-40px;width:200px;height:200px;
background:radial-gradient(circle,rgba(29,108,240,.35),transparent 70%);filter:blur(20px)}
.results-score-value{font-family:'Fraunces',serif;font-size:58px;font-weight:300;letter-spacing:-.04em;
line-height:1;margin-bottom:8px;position:relative;font-variant-numeric:tabular-nums}
.results-score-value .total{font-size:22px;opacity:.55;margin-left:4px}
.results-score-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
color:rgba(245,241,234,.65);position:relative}
.results-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:20px}
.res-stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center;
animation:itemIn .4s cubic-bezier(.16,1,.3,1) both}
.res-stat-val{font-family:'Fraunces',serif;font-size:24px;font-weight:400;letter-spacing:-.03em;line-height:1;
margin-bottom:8px;font-variant-numeric:tabular-nums}
.res-stat-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.res-stat.correct .res-stat-val{color:var(--green)}
.res-stat.wrong .res-stat-val{color:var(--red)}
.res-stat.skipped .res-stat-val{color:var(--ink-2)}
.res-stat.accuracy .res-stat-val{color:var(--accent)}
.results-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.btn-result{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 20px;border-radius:14px;
font-size:14px;font-weight:600;transition:all .15s;font-family:inherit}
.btn-result.primary{background:var(--ink);color:var(--paper)}
.btn-result.primary:hover{background:#000;transform:translateY(-1px)}
.btn-result.secondary{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn-result.secondary:hover{background:var(--paper-2)}
.results-brand-foot{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:v

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>🌸 Maths Mania · 100 Hour Batch</title>
<meta content="Maths Mania 100 Hour — VOD, IMR 1.0, IMR 2.0 &amp; Art of Skipping, organized section-wise with videos and PDFs." name="description"/>
<style>
  :root{
    --pink-50:#fff5f9;  --pink-100:#ffe6f0; --pink-200:#ffcfe3; --pink-300:#ffabce;
    --pink-500:#ff6fa8; --pink-600:#f2508f; --pink-700:#c93b74;
    --sky-50:#f0faff;   --sky-100:#e0f4ff;  --sky-200:#bfe8ff;  --sky-300:#8fd8ff;
    --sky-500:#37b3f5;  --sky-600:#1c99dd;  --sky-700:#147ab3;
    --brown-50:#fbf4ec; --brown-100:#f3e3cf; --brown-200:#e8cba6;
    --brown-400:#c99a63; --brown-600:#a4703c; --brown-700:#7d5228;
    --ink-900:#3a2a3a; --ink-700:#5d4b5c; --ink-500:#8c7789; --ink-300:#c6b3c3;
    --surface:#fffdfd; --surface-soft:#fff5f9; --border:#ffdcec;
    --pdf:var(--brown-600); --video:var(--sky-600);
    --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(150,60,110,0.08), 0 1px 1px rgba(150,60,110,0.05);
    --shadow-md:0 6px 20px rgba(150,60,110,0.10), 0 2px 6px rgba(150,60,110,0.06);
    --shadow-lg:0 16px 40px rgba(120,60,110,0.16), 0 4px 12px rgba(120,60,110,0.07);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0; min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
    color:var(--ink-900);
    background:
      radial-gradient(1100px 600px at 92% -10%, rgba(55,179,245,0.14), transparent 60%),
      radial-gradient(900px 520px at -10% 8%, rgba(255,111,168,0.14), transparent 55%),
      radial-gradient(700px 500px at 50% 100%, rgba(201,154,99,0.08), transparent 60%),
      linear-gradient(180deg, #fff7fb 0%, #f2f9ff 100%);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  ::selection{ background:var(--pink-200); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--pink-200); border-radius:20px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--sky-300); }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 1rem 3rem; }

  /* HEADER */
  .site-header{
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    background:rgba(255,247,251,0.86); border-bottom:1px solid rgba(255,111,168,0.16);
  }
  .header-inner{ max-width:1180px; margin:0 auto; padding:0.9rem 1rem 1rem; }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; gap:0.75rem; margin-bottom:0.85rem; }
  .brand{ display:flex; align-items:center; gap:0.65rem; min-width:0; }
  .brand-icon{
    flex:none; width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    background:linear-gradient(135deg, var(--pink-400,#ff9ec2), var(--sky-500));
    box-shadow:0 6px 16px rgba(242,80,143,0.35); color:#fff; overflow:hidden;
  }
  .brand-icon img{ width:100%; height:100%; object-fit:cover; border-radius:14px; display:block; }
  .brand-text{ min-width:0; }
  .brand-text h1{ margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-0.01em; color:var(--ink-900); line-height:1.25; overflow-wrap:anywhere; }
  .brand-text p{ margin:0.1rem 0 0; font-size:0.78rem; color:var(--ink-500); font-weight:600; }

  .stat-pills{ display:flex; gap:0.5rem; flex:none; }
  .pill{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0.3rem 0.7rem; border-radius:12px; background:var(--surface);
    border:1px solid var(--border); box-shadow:var(--shadow-sm); min-width:56px;
  }
  .pill b{ font-size:0.95rem; color:var(--pink-700); line-height:1.1; }
  .pill span{ font-size:0.62rem; color:var(--ink-500); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  .search-row{ display:flex; gap:0.55rem; align-items:center; }
  .search-box{ position:relative; flex:1; min-width:0; }
  .search-box svg.icon-search{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--ink-300); pointer-events:none; }
  .search-box input{
    width:100%; padding:0.75rem 2.6rem 0.75rem 2.6rem; font-size:0.95rem; font-weight:500;
    border-radius:14px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--ink-900); box-shadow:var(--shadow-sm); outline:none;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .search-box input::placeholder{ color:var(--ink-300); font-weight:500; }
  .search-box input:focus{ border-color:var(--pink-300); box-shadow:0 0 0 4px rgba(255,111,168,0.16), var(--shadow-sm); }
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); width:26px; height:26px;
    border-radius:50%; border:none; background:var(--pink-100); color:var(--pink-700);
    display:none; align-items:center; justify-content:center; cursor:pointer; transition:background .15s;
  }
  .clear-btn svg{ width:14px; height:14px; }
  .clear-btn.show{ display:flex; }
  .clear-btn:hover{ background:var(--pink-200); }

  .icon-btn-group{ display:flex; gap:0.4rem; flex:none; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center; gap:0.35rem;
    padding:0 0.8rem; height:44px; border-radius:14px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink-700); font-weight:700; font-size:0.82rem;
    cursor:pointer; white-space:nowrap; box-shadow:var(--shadow-sm);
    transition:transform .12s var(--ease), box-shadow .12s var(--ease), border-color .12s;
  }
  .icon-btn svg{ width:17px; height:17px; flex:none; }
  .icon-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); border-color:var(--sky-300); }
  .icon-btn:active{ transform:translateY(0); }

  .breadcrumb{ display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; font-size:0.8rem; color:var(--ink-500); font-weight:600; margin-top:0.65rem; min-height:1.1rem; }

  /* FOLDER GRID (sections) */
  .folder-grid{ display:flex; flex-direction:column; gap:0.85rem; margin-top:1.4rem; }
  .folder-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); overflow:hidden; animation:fadeIn .35s var(--ease) both;
    transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .folder-card:hover{ box-shadow:var(--shadow-md); border-color:var(--pink-200); }
  .folder-card.hidden-card{ display:none; }
  .folder-header{
    position:relative; display:flex; align-items:center; gap:0.8rem; padding:0.95rem 1.1rem;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .folder-header:hover{ background:var(--surface-soft); }
  .folder-icon-wrap{
    flex:none; width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, var(--pink-100), var(--sky-50)); font-size:1.3rem;
    transition:transform .28s var(--ease), background .28s var(--ease);
  }
  .folder-card.open .folder-icon-wrap{ background:linear-gradient(150deg, var(--pink-500), var(--sky-600)); transform:scale(1.03); }
  .folder-title-block{ flex:1; min-width:0; }
  .folder-title{ margin:0; font-size:0.98rem; font-weight:700; color:var(--ink-900); letter-spacing:-0.01em; overflow-wrap:anywhere; word-break:break-word; }
  .folder-title mark{ background:#ffe27a; color:inherit; border-radius:3px; padding:0 1px; }
  .folder-meta{ display:flex; align-items:center; gap:0.5rem; flex:none; }
  .file-count-badge{ background:var(--pink-50); color:var(--pink-700); font-size:0.72rem; font-weight:800; padding:0.28rem 0.6rem; border-radius:20px; border:1px solid var(--pink-100); white-space:nowrap; }
  .chevron{ flex:none; width:20px; height:20px; color:var(--ink-300); transition:transform .28s var(--ease), color .2s; }
  .folder-card.open .chevron{ transform:rotate(180deg); color:var(--sky-600); }

  .folder-body{ max-height:0; overflow:hidden; transition:max-height .32s var(--ease); }
  .folder-body-inner{ padding:0 1.1rem 1.1rem; }
  .file-list{ display:flex; flex-direction:column; gap:0.55rem; }
  .file-item{
    display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap;
    padding:0.7rem 0.85rem; border-radius:var(--radius-md); background:var(--surface-soft); border:1px solid var(--border);
    animation:slideDown .28s var(--ease) both;
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), border-color .14s, background .14s;
  }
  .file-item:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--pink-200); background:var(--surface); }
  .file-name-block{ flex:1 1 200px; min-width:0; display:flex; flex-direction:column; gap:0.3rem; }
  .file-name{ font-size:0.86rem; font-weight:600; color:var(--ink-700); overflow-wrap:anywhere; word-break:break-word; line-height:1.35; }
  .file-name mark{ background:#ffe27a; color:inherit; border-radius:3px; padding:0 1px; }
  .quality-badge{
    display:inline-flex; align-items:center; width:fit-content; font-size:0.62rem; font-weight:800;
    letter-spacing:.03em; text-transform:uppercase; padding:0.16rem 0.5rem; border-radius:20px;
    background:var(--brown-50); color:var(--brown-700); border:1px solid var(--brown-100);
  }
  .file-actions{ display:flex; gap:0.4rem; flex:none; flex-wrap:wrap; }
  .open-btn{
    display:flex; align-items:center; gap:0.3rem; padding:0.42rem 0.75rem; border-radius:10px;
    background:var(--surface); border:1.5px solid var(--border); font-size:0.75rem; font-weight:800;
    text-decoration:none; white-space:nowrap; transition:background .15s, color .15s, border-color .15s, transform .12s;
  }
  .open-btn svg{ width:13px; height:13px; }
  .open-btn.video{ color:var(--sky-700); }
  .open-btn.video:hover{ background:linear-gradient(135deg, var(--sky-500), var(--sky-600)); color:#fff; border-color:transparent; transform:translateY(-1px); }
  .open-btn.pdf{ color:var(--brown-600); }
  .open-btn.pdf:hover{ background:linear-gradient(135deg, var(--brown-400), var(--brown-600)); color:#fff; border-color:transparent; transform:translateY(-1px); }
  .no-pdf-note{ font-size:0.72rem; color:var(--ink-300); font-weight:700; font-style:italic; }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3.5rem 1rem; text-align:center; color:var(--ink-500); animation:fadeIn .3s var(--ease) both; }
  .empty-state svg{ width:64px; height:64px; color:var(--pink-200); margin-bottom:1rem; }
  .empty-state h3{ margin:0 0 0.35rem; color:var(--ink-900); font-size:1.05rem; }
  .empty-state p{ margin:0; font-size:0.85rem; max-width:320px; }

  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes slideDown{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  /* social row */
  .social-row{ display:flex; gap:0.6rem; margin-top:0.85rem; }
  .social-btn{
    position:relative; overflow:hidden; flex:1; display:flex; align-items:center; justify-content:center; gap:0.45rem;
    height:46px; border-radius:14px; border:none; cursor:pointer; color:#fff; font-weight:800; font-size:0.82rem;
    text-decoration:none; box-shadow:var(--shadow-sm); transition:transform .12s var(--ease), box-shadow .12s var(--ease);
  }
  .social-btn svg{ width:18px; height:18px; flex:none; }
  .social-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .social-btn.wa{ background:linear-gradient(135deg,#25d366,#1aa851); }

  /* floating WA button */
  .wa-fab{
    position:fixed; bottom:22px; right:22px; z-index:60; width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg,#25d366,#1aa851); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-lg); text-decoration:none; transition:transform .15s var(--ease);
  }
  .wa-fab:hover{ transform:translateY(-2px) scale(1.05); }
  .wa-fab svg{ width:28px; height:28px; }

  /* modal overlay */
  .overlay{ position:fixed; inset:0; z-index:70; background:rgba(58,42,58,0.45); display:flex; align-items:center; justify-content:center; padding:1rem; backdrop-filter:blur(2px); }
  .overlay.hidden{ display:none; }
  .modal-card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); max-width:380px; width:100%; padding:1.6rem 1.4rem; text-align:center; animation:fadeIn .3s var(--ease) both; }
  .modal-card .emoji{ font-size:2.6rem; margin-bottom:0.5rem; }
  .modal-card h3{ margin:0 0 0.35rem; font-size:1.05rem; color:var(--ink-900); }
  .modal-card p{ margin:0 0 1.1rem; font-size:0.85rem; color:var(--ink-500); line-height:1.5; }
  .modal-card .dismiss{ margin-top:0.8rem; background:none; border:none; color:var(--ink-300); font-size:0.78rem; font-weight:700; text-decoration:underline; cursor:pointer; }

  body.has-fab .wrap{ padding-bottom:2rem; }

  @media (max-width:640px){
    .brand-text h1{ font-size:1rem; }
    .stat-pills{ display:none; }
    .icon-btn .label{ display:none; }
    .icon-btn{ padding:0 0.65rem; width:44px; }
    .folder-title{ font-size:0.9rem; }
    .file-name{ font-size:0.8rem; }
    .wrap{ padding:0 0.65rem 2.5rem; }
    .header-inner{ padding:0.75rem 0.65rem 0.85rem; }
    .file-item{ flex-direction:column; align-items:stretch; }
    .file-actions{ justify-content:flex-start; }
  }
</style>

// ================================================================

const folders = rawData.map(function(folder, folderIndex){
  const items = folder.items.map(function(item, itemIndex){
    return {
      id: folderIndex + '-' + itemIndex,
      title: item.title,
      lower: item.title.toLowerCase(),
      quality: item.quality || '',
      video: item.video || null,
      pdfs: item.pdfs || []
    };
  });
  return {
    index: folderIndex,
    key: folder.key,
    icon: folder.icon,
    name: folder.name,
    lower: folder.name.toLowerCase(),
    items: items,
    itemCount: items.length,
    open: false,
    bodyEl: null,
    listEl: null,
    cardEl: null,
    built: false
  };
});

const TOTAL_FOLDERS = folders.length;

statFoldersEl.textContent = TOTAL_FOLDERS;
statFilesEl.textContent = TOTAL_FILES;

// ================================================================
// 5. Helpers
// ================================================================
function escapeHTML(str){
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlight(text, query){
  const safe = escapeHTML(text);
  if (!query) return safe;
  const lowerText = text.toLowerCase();
  const idx = lowerText.indexOf(query);
  if (idx === -1) return safe;
  const before = escapeHTML(text.slice(0, idx));
  const match = escapeHTML(text.slice(idx, idx + query.length));
  const after = escapeHTML(text.slice(idx + query.length));
  return before + '<mark>' + match + '</mark>' + after;
}

function createFileItemEl(item, query){
  const el = document.createElement('div');
  el.className = 'file-item';

  const nameBlock = document.createElement('div');
  nameBlock.className = 'file-name-block';

  const name = document.createElement('div');
  name.className = 'file-name';
  name.innerHTML = highlight(item.title, query);
  name.title = item.title;
  nameBlock.appendChild(name);

  if (item.quality){
    const badge = document.createElement('span');
    badge.className = 'quality-badge';
    badge.textContent = item.quality;
    nameBlock.appendChild(badge);
  }
  el.appendChild(nameBlock);

  const actions = document.createElement('div');
  actions.className = 'file-actions';
  if (item.video){
    const a = document.createElement('a');
    a.className = 'open-btn video';
    a.href = item.video; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = ICONS.video + '<span>Video</span>';
    actions.appendChild(a);
  }
  if (item.pdfs && item.pdfs.length){
    item.pdfs.forEach(function(p){
      if (!p.url) return;
      const a = document.createElement('a');
      a.className = 'open-btn pdf';
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = ICONS.pdf + '<span>' + escapeHTML(p.label) + '</span>';
      actions.appendChild(a);
    });
  }
  el.appendChild(actions);
  return el;
}

function populateFileList(folder, query, subsetItems){
  const items = subsetItems || folder.items;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < items.length; i++){
    frag.appendChild(createFileItemEl(items[i], query));
  }
  folder.listEl.innerHTML = '';
  folder.listEl.appendChild(frag);
}

function setFolderOpen(folder, open, query, subsetItems){
  folder.open = open;
  folder.cardEl.classList.toggle('open', open);
  if (open && !folder.built){
    populateFileList(folder, query, subsetItems);
    folder.built = true;
  }
  folder.bodyEl.style.maxHeight = open ? folder.bodyEl.scrollHeight + 400 + 'px' : '0px';
}

function toggleFolder(folder){
  setFolderOpen(folder, !folder.open, searchInputEl.value.trim().toLowerCase());
}

function createFolderCardEl(folder){
  const card = document.createElement('div');
  card.className = 'folder-card';
  folder.cardEl = card;

  const header = document.createElement('div');
  header.className = 'folder-header';
  header.innerHTML =
    '<div class="folder-icon-wrap">' + folder.icon + '</div>' +
    '<div class="folder-title-block"><h3 class="folder-title" data-title></h3></div>' +
    '<div class="folder-meta"><span class="file-count-badge" data-count>' + folder.itemCount + ' items</span>' +
    '<span class="chevron">' + ICONS.chevron + '</span></div>';
  header.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);
  header.addEventListener('click', function(){ toggleFolder(folder); });
  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'folder-body';
  folder.bodyEl = body;
  const bodyInner = document.createElement('div');
  bodyInner.className = 'folder-body-inner';
  const list = document.createElement('div');
  list.className = 'file-list';
  folder.listEl = list;
  bodyInner.appendChild(list);
  body.appendChild(bodyInner);
  card.appendChild(body);

  return card;
}

function renderAllFolderShells(){
  const frag = document.createDocumentFragment();
  folders.forEach(function(folder){
    frag.appendChild(createFolderCardEl(folder));
  });
  folderGridEl.appendChild(frag);
}
renderAllFolderShells();

// ================================================================
// 6. Search
// ================================================================
function renderEmptyState(){
  folderGridEl.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'empty-state';
  el.innerHTML = ICONS.emptyBox + '<h3>No results found</h3><p>Try a different search term.</p>';
  folderGridEl.appendChild(el);
}

let emptyShown = false;
function restoreFolderGrid(){
  if (emptyShown){
    folderGridEl.innerHTML = '';
    folders.forEach(function(folder){ folderGridEl.appendChild(folder.cardEl); });
    emptyShown = false;
  }
}

function updateBreadcrumb(query){
  if (!query){ breadcrumbEl.textContent = ''; return; }
  let matches = 0;
  folders.forEach(function(f){
    if (f.lower.indexOf(query) !== -1) matches += f.itemCount;
    else f.items.forEach(function(it){ if (it.lower.indexOf(query) !== -1) matches++; });
  });
  breadcrumbEl.textContent = matches + ' result' + (matches === 1 ? '' : 's') + ' for "' + query + '"';
}

function applySearch(rawQuery){
  const query = rawQuery.trim().toLowerCase();
  clearBtnEl.classList.toggle('show', query.length > 0);
  updateBreadcrumb(query);

  if (!query){
    restoreFolderGrid();
    folders.forEach(function(folder){
      folder.cardEl.classList.remove('hidden-card');
      folder.cardEl.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);
      folder.cardEl.querySelector('[data-count]').textContent = folder.itemCount + ' items';
      if (folder.built) populateFileList(folder, '');
    });
    return;
  }

  restoreFolderGrid();
  let anyVisible = false;
  folders.forEach(function(folder){
    const nameMatches = folder.lower.indexOf(query) !== -1;
    const matchedItems = folder.items.filter(function(it){ return it.lower.indexOf(query) !== -1; });
    const show = nameMatches || matchedItems.length > 0;
    folder.cardEl.classList.toggle('hidden-card', !show);
    if (!show) return;
    anyVisible = true;
    folder.cardEl.querySelector('[data-title]').innerHTML = highlight(folder.name, query);
    const subset = nameMatches && matchedItems.length === 0 ? folder.items : matchedItems;
    folder.cardEl.querySelector('[data-count]').textContent = subset.length + ' items';
    setFolderOpen(folder, true, query, subset);
  });

  if (!anyVisible){ renderEmptyState(); emptyShown = true; }
}

function handleSearchInput(){ applySearch(searchInputEl.value); }
searchInputEl.addEventListener('input', handleSearchInput);
clearBtnEl.addEventListener('click', function(){
  searchInputEl.value = '';
  applySearch('');
  searchInputEl.focus();
});

function expandAll(){
  folders.forEach(function(f){ if (!f.cardEl.classList.contains('hidden-card')) setFolderOpen(f, true, searchInputEl.value.trim().toLowerCase()); });
}
function collapseAll(){
  folders.forEach(function(f){ setFolderOpen(f, false); });
}
expandAllBtnEl.addEventListener('click', expandAll);
collapseAllBtnEl.addEventListener('click', collapseAll);

</script>

    (root||document).querySelectorAll('.folder-card').forEach(function(c){

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1ea">
<title>Current Affairs · Choudhary Mehfil</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{margin:0;padding:0}
body{background:radial-gradient(900px 500px at 100% -10%,rgba(242,96,42,.12),transparent 60%),linear-gradient(180deg,#f7f1ea,#f3ebe2);color:#1a1412;font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Noto Sans Math','Noto Sans Symbols 2',sans-serif;min-height:100vh;padding:0 16px 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0}
.nav{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #eee4d8;color:#3d322c;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 1px 2px rgba(60,30,10,.06);cursor:pointer;font-family:inherit}
.dp{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid #fff;box-shadow:0 6px 16px rgba(194,63,16,.3);display:flex;align-items:center;justify-content:center;font-size:20px}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
header{text-align:center;padding:26px 0 18px}
.badge{display:inline-block;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#c23f10;background:#ffe9dc;border:1px solid #ffd2b8;padding:7px 13px;border-radius:999px;margin-bottom:14px;text-transform:uppercase}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
h1 span{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#f2602a}
.sub{margin-top:8px;color:#8a7d73;font-size:13.5px}
.list{display:flex;flex-direction:column;gap:.8rem;counter-reset:t}
.row{counter-increment:t;display:flex;align-items:center;gap:1rem;padding:1.15rem 1.2rem;border-radius:26px;background:#fff;border:1px solid #eee4d8;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(60,30,10,.05);transition:.2s;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.row:active{transform:scale(.985)}
.num{min-width:2.8rem}
.num::before{content:counter(t,decimal-leading-zero);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:2.1rem;line-height:1;color:#f2602a;letter-spacing:-.03em}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.t{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.m{font-size:.85rem;color:#9d9088}
.arr{width:46px;height:46px;border-radius:50%;background:#f2ece5;color:#3d322c;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.25s}
.row:hover .arr,.row:active .arr{background:#1a1412;color:#fff}
.row.soon{opacity:.75}
.row.soon .arr{font-size:10px;font-weight:800;letter-spacing:.04em;width:auto;border-radius:999px;padding:0 12px;height:34px;background:#ffe9dc;color:#c23f10}
/* month rows */
.mrow{display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;border-radius:22px;background:#fff;border:1px solid #eee4d8;box-shadow:0 1px 2px rgba(60,30,10,.05)}
.mrow .t{font-size:1.02rem}
.btns{display:flex;gap:8px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:999px;font-weight:800;font-size:12.5px;text-decoration:none;font-family:inherit;border:0;cursor:pointer}
.pill.open{background:linear-gradient(180deg,#f2602a,#d24a14);color:#fff;box-shadow:0 6px 14px -6px rgba(242,96,42,.8)}
.pill.soon{background:#ffe9dc;color:#c23f10;font-size:11px;letter-spacing:.06em;cursor:default}
.pill.dl{background:#f2ece5;color:#3d322c;width:40px;padding:0;justify-content:center}
.crumb{font:600 11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#a2958b;text-align:center;margin-top:6px}
.join{text-align:center;padding:30px 0 6px}
.join a{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(180deg,#34d399,#10b981);color:#03261c;font:800 15px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Math',sans-serif;text-decoration:none;box-shadow:0 10px 24px -8px rgba(16,185,129,.7)}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:#1a1412;color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.mrow{flex-wrap:wrap}.btns{width:100%}.pill.open{flex:1;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="nav" id="backBtn" type="button">&#8592; Back</button>
    <div class="dp"><img src="channel-dp.jpg" alt="" onerror="this.parentNode.textContent='C'"></div>
  </div>
  <header>
    <div class="badge" id="badge">MAGAZINES</div>
    <h1 id="title">Current <span>Affairs</span></h1>
    <p class="sub" id="sub">Apna section chuno</p>
    <p class="crumb" id="crumb"></p>
  </header>
  <div class="list" id="list"></div>
  <div class="join"><a href="https://whatsapp.com/channel/0029VbBqYvh2phHSBhGVGD08" target="_blank" rel="noopener">&#128172; 𝕁𝕠𝕚𝕟 𝕎𝕙𝕒𝕥𝕤𝕒𝕡𝕡 ℂ𝕙𝕒𝕟𝕟𝕖𝕝</a></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  /* =========================================================
     SETTINGS  (yahin se sab kuch control hota hai)
     ========================================================= */
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Har saal me kitne mahine ki PDF hai
  var YEARS={ '2025':12, '2026':9 };

  // =====  PDF FILE MAP  =====
  // 'bhasha-saal-mahina' : 'file ka naam'   (ya poora https:// link)
  // null  = abhi PDF nahi hai -> "JALDI" dikhega
  var FILES={
    // ---- 2025 HINDI ----
    'hindi-2025-01':'JANUARY 2025 hindi.pdf',
    'hindi-2025-02':'FEBRUARY 2025 hindi.pdf',
    'hindi-2025-03':'MARCH - 2025 hindi.pdf',
    'hindi-2025-04':'APRIL 2025 hindi.pdf',
    'hindi-2025-05':'MAY - 2025 hindi.pdf',
    'hindi-2025-06':'JUNE - 2025 hindi.pdf',
    'hindi-2025-07':'JULY 2025 hindi.pdf',
    'hindi-2025-08':'AUGUST 2025 hindi.pdf',
    'hindi-2025-09':'SEPTEMBER 2025 hindi.pdf',
    'hindi-2025-10':'OCTOBER 2025 Hindi.pdf',
    'hindi-2025-11':'PARMAR CURRENT NOVEMBER.pdf',
    'hindi-2025-12':'DECEMBER HINDI CURRENT AFFAIRS MAGAZINE.pdf',
    // ---- 2025 ENGLISH ----
    'english-2025-01':'JANUARY 2025.pdf',
    'english-2025-02':'FEBRUARY 2025.pdf',
    'english-2025-03':'MARCH 2025.pdf',
    'english-2025-04':'APRIL 2025.pdf',
    'english-2025-05':'MAY 2025.pdf',
    'english-2025-06':'JUNE 2025.pdf',
    'english-2025-07':'JULY 2025.pdf',
    'english-2025-08':'AUGUST 2025.pdf',
    'english-2025-09':'SEPTEMBER 2025.pdf',
    'english-2025-10':'OCTOBER 2025 English.pdf',
    'english-2025-11':'NOVEMBER CURRENT AFFAIRS English (1).pdf',
    'english-2025-12':'DECEMBER_ENGLISH_2025.pdf',
    // ---- 2026 HINDI ----
    'hindi-2026-01':null,   // 127 MB -- bahut badi, link aane par yahan daalna
    'hindi-2026-02':'FEBRUARY HINDI CURRENT AFFAIRS MAGAZINE.pdf',
    'hindi-2026-03':'MARCH HINDI CA MAGZINE PARMAR SIR.pdf',
    'hindi-2026-04':'PARMAR_APRIL_HINDI_CA_MAGAZINE.pdf',
    'hindi-2026-05':'PARMAR_MAY_CA_MAGZINE_HINDI.pdf',
    'hindi-2026-06':'JUN_HINDI_PARMAR_CURRENT_MAGZINE.pdf',
    'hindi-2026-07':'PARMAR_CA_JULY_HINDI_MEDIUM_.pdf',
    'hindi-2026-08':'Parmar_August_CA_Hindi_by_choudhary.pdf',
    'hindi-2026-09':null,
    // ---- 2026 ENGLISH ----
    'english-2026-01':null, // 126 MB -- bahut badi, link aane par yahan daalna
    'english-2026-02':'FEBRUARY ENGLISH CURRENT AFFAIRS MAGAZINE.pdf',
    'english-2026-03':'MARCH ENGLISH CA MAGZINE PARMAR SIR.pdf',
    'english-2026-04':'CURRENT AFFAIRS MAGAZINE - 2026 APRIL 2026.pdf',
    'english-2026-05':'PARMAR_MAY_CA_MAGZINE_ENGLISH.pdf',
    'english-2026-06':'JUN_ENGLISH_MEDIUM_PARMAR_CA_MAGAZINE.pdf',
    'english-2026-07':'PARMAR_CA_JULY_ENGLISH_MEDIUM.pdf',
    'english-2026-08':'Parmar_August_CA_English_by_choudhary.pdf',
    'english-2026-09':null
  };

  var LANGS={
    hindi:   {label:'𝙷𝙸𝙽𝙳𝙸 𝙼𝙰𝙶𝚉𝙸𝙽𝙴',   short:'Hindi'},
    english: {label:'𝙴𝙽𝙶𝙻𝙸𝚂𝙷 𝙼𝙰𝙶𝚉𝙸𝙽𝙴', short:'English'}
  };

  // Pehla page ke cards
  var SECTIONS=[
    {key:'parmar',  label:'𝗣𝗮𝗿𝗺𝗮𝗿 𝗖𝗔',        sub:'Monthly Magazines 2025-2026', ready:true},
    {key:'parcham', label:'𝗣𝗮𝗿𝗰𝗵𝗮𝗺 𝗖𝗹𝗮𝘀𝘀𝗲𝘀',   sub:'Current Affairs',            ready:false},
    {key:'indologous', label:'𝗜𝗻𝗱𝗼𝗹𝗼𝗴𝗼𝘂𝘀 𝗖𝗔', sub:'Current Affairs',            ready:false},
    {key:'other',   label:'𝗢𝘁𝗵𝗲𝗿 𝗖𝗔',         sub:'Current Affairs',            ready:false}
  ];

  /* ========================================================= */
  var $=function(id){return document.getElementById(id);};
  var list=$('list');
  var ARROW='<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var DL='<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}
  function go(h){location.hash=h;}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  function head(title,sub,badge,crumb){
    $('title').innerHTML=title; $('sub').textContent=sub||''; $('badge').textContent=badge||'MAGAZINES'; $('crumb').textContent=crumb||'';
  }
  function card(label,sub,onclick,opts){
    opts=opts||{};
    var el=document.createElement('button');
    el.type='button'; el.className='row'+(opts.soon?' soon':'');
    el.innerHTML='<span class="num"></span><span class="txt"><span class="t">'+esc(label)+'</span><span class="m">'+esc(sub||'')+'</span></span><span class="arr">'+(opts.soon?'JALDI':ARROW)+'</span>';
    el.addEventListener('click',onclick); list.appendChild(el);
  }

  function render(){
    var p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
    list.innerHTML=''; window.scrollTo(0,0);
    var back=$('backBtn');
    back.textContent = p.length ? '← Back' : '← Home';

    if(p.length===0){
      head('Current <span>Affairs</span>','Apna section chuno','MAGAZINES','');
      SECTIONS.forEach(function(s){
        card(s.label,s.sub,function(){ s.ready?go('/'+s.key):toast('Ye section jaldi aa raha hai'); },{soon:!s.ready});
      });
      return;
    }
    if(p[0]==='parmar' && p.length===1){
      head('𝗣𝗮𝗿𝗺𝗮𝗿 <span>𝗖𝗔</span>','Saal chuno','PARMAR','');
      Object.keys(YEARS).forEach(function(y){
        card(y,'Hindi & English Magazines · '+(YEARS[y]*2)+' PDFs',function(){go('/parmar/'+y);});
      });
      return;
    }
    if(p[0]==='parmar' && YEARS[p[1]] && p.length===2){
      head('Parmar <span>'+p[1]+'</span>','Language chuno','PARMAR CA','PARMAR › '+p[1]);
      Object.keys(LANGS).forEach(function(l){
        card(LANGS[l].label,YEARS[p[1]]+' months',function(){go('/parmar/'+p[1]+'/'+l);});
      });
      return;
    }
    if(p[0]==='parmar' && YEARS[p[1]] && LANGS[p[2]]){
      var y=p[1],l=p[2];
      head(LANGS[l].label,'Mahina chuno aur PDF kholo','PARMAR '+y,'PARMAR › '+y+' › '+LANGS[l].short.toUpperCase());
      for(var i=0;i<YEARS[y];i++){
        (function(i){
          var key=l+'-'+y+'-'+('0'+(i+1)).slice(-2);
          var file=FILES[key];
          var row=document.createElement('div'); row.className='mrow';
          var actions;
          if(file){
            var url=/^https?:\/\//i.test(file)?file:encodeURI(file);
            actions='<a class="pill open" href="'+url+'" target="_blank" rel="noopener">Open</a>'+
                    '<a class="pill dl" href="'+url+'" download aria-label="Download">'+DL+'</a>';
          }else{
            actions='<span class="pill soon">JALDI</span>';
          }
          row.innerHTML='<span class="txt"><span class="t">'+MONTHS[i]+' '+y+'</span><span class="m">'+LANGS[l].short+' Magazine \u00b7 PDF</span></span><span class="btns">'+actions+'</span>';
          list.appendChild(row);
        })(i);
      }
      return;
    }
    go('/');
  }

  $('backBtn').addEventListener('click',function(){
    var p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
    if(!p.length){ location.href='index.html'; return; }
    p.pop(); location.hash='/'+p.join('/');
  });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>

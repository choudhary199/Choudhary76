<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>📚 Aditya Ranjan VOD 3.0</title>
<meta content="Fast, modern study resource explorer — videos and PDFs organized by chapter." name="description"/>
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --blue-50:#eef6ff;
    --blue-100:#e0f0ff;
    --blue-200:#c7e3ff;
    --blue-300:#a3d1ff;
    --blue-500:#2f8bff;
    --blue-600:#1f6fe0;
    --blue-700:#1656b3;
    --blue-900:#0d3a75;
    --ink-900:#0b1a33;
    --ink-700:#33455e;
    --ink-500:#5b6b85;
    --ink-300:#8a97ac;
    --surface:#ffffff;
    --surface-soft:#f4f9ff;
    --border:#dfeaf7;
    --pdf:#e0473e;
    --video:#2f8bff;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(13,58,117,0.06), 0 1px 1px rgba(13,58,117,0.04);
    --shadow-md:0 6px 20px rgba(20,70,140,0.08), 0 2px 6px rgba(20,70,140,0.05);
    --shadow-lg:0 16px 40px rgba(20,70,140,0.14), 0 4px 12px rgba(20,70,140,0.06);
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
    color:var(--ink-900);
    background:
      radial-gradient(1100px 600px at 90% -10%, rgba(47,139,255,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(47,139,255,0.08), transparent 55%),
      linear-gradient(180deg, #f2f8ff 0%, #eaf3fd 100%);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--blue-200); }

  /* scrollbar (webkit) */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--blue-200); border-radius:20px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--blue-300); }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 1rem 3rem; }

  /* ============================================================
     HEADER
     ============================================================ */
  .site-header{
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    background:rgba(244,249,255,0.82);
    border-bottom:1px solid rgba(47,139,255,0.14);
  }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:0.9rem 1rem 1rem;
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between; gap:0.75rem;
    margin-bottom:0.85rem;
  }
  .brand{
    display:flex; align-items:center; gap:0.65rem; min-width:0;
  }
  .brand-icon{
    flex:none;
    width:42px; height:42px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--blue-500), var(--blue-700));
    box-shadow:0 6px 16px rgba(31,111,224,0.35);
    color:#fff;
  }
  .brand-icon svg{ width:22px; height:22px; }
  .brand-text{ min-width:0; }
  .brand-text h1{
    margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-0.01em;
    color:var(--ink-900);
    white-space:normal; overflow-wrap:anywhere; line-height:1.25;
  }
  .brand-text p{
    margin:0.1rem 0 0; font-size:0.78rem; color:var(--ink-500); font-weight:500;
  }

  .stat-pills{ display:flex; gap:0.5rem; flex:none; }
  .pill{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0.3rem 0.7rem; border-radius:12px;
    background:var(--surface); border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    min-width:56px;
  }
  .pill b{ font-size:0.95rem; color:var(--blue-700); line-height:1.1; }
  .pill span{ font-size:0.62rem; color:var(--ink-500); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }

  /* search */
  .search-row{ display:flex; gap:0.55rem; align-items:center; }
  .search-box{
    position:relative; flex:1; min-width:0;
  }
  .search-box svg.icon-search{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--ink-300); pointer-events:none;
  }
  .search-box input{
    width:100%; padding:0.75rem 2.6rem 0.75rem 2.6rem;
    font-size:0.95rem; font-weight:500;
    border-radius:14px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink-900);
    box-shadow:var(--shadow-sm);
    outline:none;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .search-box input::placeholder{ color:var(--ink-300); font-weight:500; }
  .search-box input:focus{
    border-color:var(--blue-500);
    box-shadow:0 0 0 4px rgba(47,139,255,0.14), var(--shadow-sm);
  }
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:none;
    background:var(--blue-100); color:var(--blue-700);
    display:none; align-items:center; justify-content:center; cursor:pointer;
    transition:background .15s;
  }
  .clear-btn svg{ width:14px; height:14px; }
  .clear-btn.show{ display:flex; }
  .clear-btn:hover{ background:var(--blue-200); }

  .icon-btn-group{ display:flex; gap:0.4rem; flex:none; }
  .icon-btn{
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:0.35rem;
    padding:0 0.8rem; height:44px; border-radius:14px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink-700); font-weight:700; font-size:0.82rem;
    cursor:pointer; white-space:nowrap;
    box-shadow:var(--shadow-sm);
    transition:transform .12s var(--ease), box-shadow .12s var(--ease), border-color .12s;
  }
  .icon-btn svg{ width:17px; height:17px; flex:none; }
  .icon-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); border-color:var(--blue-300); }
  .icon-btn:active{ transform:translateY(0); }
  .icon-btn .label{ display:inline; }

  /* breadcrumb */
  .breadcrumb{
    display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap;
    font-size:0.8rem; color:var(--ink-500); font-weight:600;
    margin-top:0.65rem; min-height:1.1rem;
  }
  .breadcrumb .crumb{ color:var(--blue-700); cursor:pointer; }
  .breadcrumb .crumb:hover{ text-decoration:underline; }
  .breadcrumb .sep{ color:var(--ink-300); }

  /* ============================================================
     FOLDER GRID
     ============================================================ */
  .folder-grid{
    display:flex; flex-direction:column; gap:0.85rem;
    margin-top:1.4rem;
  }

  .folder-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    animation:fadeIn .35s var(--ease) both;
    transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .folder-card:hover{ box-shadow:var(--shadow-md); border-color:var(--blue-200); }
  .folder-card.hidden-card{ display:none; }

  .folder-header{
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:0.8rem;
    padding:0.95rem 1.1rem;
    cursor:pointer; user-select:none;
    background:transparent;
    -webkit-tap-highlight-color:transparent;
  }
  .folder-header:hover{ background:var(--surface-soft); }

  .folder-icon-wrap{
    flex:none; width:44px; height:44px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, var(--blue-100), var(--blue-50));
    color:var(--blue-600);
    transition:transform .28s var(--ease), background .28s var(--ease), color .28s;
  }
  .folder-icon-wrap svg{ width:22px; height:22px; }
  .folder-card.open .folder-icon-wrap{
    background:linear-gradient(150deg, var(--blue-500), var(--blue-700));
    color:#fff;
    transform:scale(1.03);
  }

  .folder-title-block{ flex:1; min-width:0; }
  .folder-title{
    margin:0; font-size:0.98rem; font-weight:700; color:var(--ink-900);
    letter-spacing:-0.01em;
    white-space:normal; overflow-wrap:anywhere; word-break:break-word;
  }
  .folder-title mark{ background:#ffe27a; color:inherit; border-radius:3px; padding:0 1px; }
  .folder-sub{ margin:0.15rem 0 0; font-size:0.75rem; color:var(--ink-500); font-weight:600; }

  .folder-meta{ display:flex; align-items:center; gap:0.5rem; flex:none; }
  .file-count-badge{
    background:var(--blue-50); color:var(--blue-700);
    font-size:0.72rem; font-weight:800;
    padding:0.28rem 0.6rem; border-radius:20px;
    border:1px solid var(--blue-100);
    white-space:nowrap;
  }
  .chevron{
    flex:none; width:20px; height:20px; color:var(--ink-300);
    transition:transform .28s var(--ease), color .2s;
  }
  .folder-card.open .chevron{ transform:rotate(180deg); color:var(--blue-600); }

  /* collapsible body */
  .folder-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .32s var(--ease);
  }
  .folder-body-inner{
    padding:0 1.1rem 1rem;
    border-top:1px solid var(--border);
    margin-top:0;
  }
  .file-list{
    display:flex; flex-direction:column; gap:0.45rem; padding-top:0.85rem;
  }

  /* ripple */
  .ripple{
    position:absolute; border-radius:50%; pointer-events:none;
    background:rgba(47,139,255,0.28);
    transform:scale(0); animation:rippleAnim .55s var(--ease);
  }
  @keyframes rippleAnim{ to{ transform:scale(1); opacity:0; } }

  /* ============================================================
     FILE CARD
     ============================================================ */
  .file-item{
    display:flex; align-items:flex-start; gap:0.7rem;
    padding:0.65rem 0.7rem;
    border-radius:var(--radius-md);
    background:var(--surface-soft);
    border:1px solid transparent;
    animation:slideDown .28s var(--ease) both;
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), border-color .14s, background .14s;
  }
  .file-item:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
    border-color:var(--blue-200);
    background:var(--surface);
  }
  .file-icon{
    flex:none; width:36px; height:36px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; margin-top:0.1rem;
  }
  .file-icon svg{ width:18px; height:18px; }
  .file-icon.video{ background:linear-gradient(150deg,#4d9bff,#1f6fe0); }
  .file-icon.pdf{ background:linear-gradient(150deg,#ff6b61,#e0473e); }
  .file-icon.other{ background:linear-gradient(150deg,#9aa7bd,#6b788f); }

  .file-name{
    flex:1; min-width:0; font-size:0.86rem; font-weight:600; color:var(--ink-700);
    white-space:normal; overflow-wrap:anywhere; word-break:break-word; line-height:1.35;
  }
  .file-name mark{ background:#ffe27a; color:inherit; border-radius:3px; padding:0 1px; }

  .open-btn{
    position:relative; overflow:hidden; flex:none;
    display:flex; align-items:center; gap:0.3rem;
    padding:0.42rem 0.75rem; border-radius:10px;
    background:var(--surface); border:1.5px solid var(--border);
    color:var(--blue-700); font-size:0.75rem; font-weight:800;
    text-decoration:none; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s, transform .12s;
  }
  .open-btn svg{ width:13px; height:13px; }
  .open-btn:hover{
    background:linear-gradient(135deg, var(--blue-500), var(--blue-600));
    color:#fff; border-color:transparent; transform:translateY(-1px);
  }
  .open-btn:active{ transform:translateY(0); }

  /* ============================================================
     STATES: empty / no-results
     ============================================================ */
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:3.5rem 1rem; text-align:center; color:var(--ink-500);
    animation:fadeIn .3s var(--ease) both;
  }
  .empty-state svg{ width:64px; height:64px; color:var(--blue-200); margin-bottom:1rem; }
  .empty-state h3{ margin:0 0 0.35rem; color:var(--ink-900); font-size:1.05rem; }
  .empty-state p{ margin:0; font-size:0.85rem; max-width:320px; }

  /* ============================================================
     ANIMATIONS
     ============================================================ */
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes slideDown{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width:640px){
    .brand-text h1{ font-size:1rem; }
    .brand-text p{ display:none; }
    .stat-pills{ display:none; }
    .icon-btn .label{ display:none; }
    .icon-btn{ padding:0 0.65rem; width:44px; }
    .folder-title{ font-size:0.9rem; }
    .file-name{ font-size:0.8rem; }
    .wrap{ padding:0 0.65rem 2.5rem; }
    .header-inner{ padding:0.75rem 0.65rem 0.85rem; }
  }
  /* ============================================================
     SOCIAL ROW (WhatsApp / Telegram quick links)
     ============================================================ */
  .social-row{ display:flex; gap:0.6rem; margin-top:0.85rem; }
  .social-btn{
    position:relative; overflow:hidden;
    flex:1; display:flex; align-items:center; justify-content:center; gap:0.45rem;
    height:46px; border-radius:14px; border:none; cursor:pointer;
    color:#fff; font-weight:800; font-size:0.82rem; text-decoration:none;
    box-shadow:var(--shadow-sm);
    transition:transform .12s var(--ease), box-shadow .12s var(--ease);
  }
  .social-btn svg{ width:18px; height:18px; flex:none; }
  .social-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .social-btn:active{ transform:translateY(0); }
  .social-btn.wa{ background:linear-gradient(135deg,#25d366,#1aa851); }
  .social-btn.tg{ background:linear-gradient(135deg,#34b3f1,#1683c9); }

  /* floating bell */
  .bell-fab{
    position:fixed; top:16px; right:16px; z-index:60;
    width:48px; height:48px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--blue-600);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-md); cursor:pointer;
    transition:transform .15s var(--ease);
  }
  .bell-fab:hover{ transform:translateY(-2px) scale(1.04); }
  .bell-fab svg{ width:21px; height:21px; }
  .bell-dot{
    position:absolute; top:5px; right:5px; min-width:16px; height:16px; padding:0 3px;
    border-radius:50%; background:#e0473e; color:#fff; font-size:9px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--surface);
  }
  .bell-dot.hidden{ display:none; }

  /* modal overlays (popup + inbox) */
  .overlay{
    position:fixed; inset:0; z-index:70;
    background:rgba(11,26,51,0.45);
    display:flex; align-items:center; justify-content:center; padding:1rem;
    backdrop-filter:blur(2px);
  }
  .overlay.hidden{ display:none; }
  .modal-card{
    background:var(--surface); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg); max-width:380px; width:100%;
    padding:1.6rem 1.4rem; text-align:center;
    animation:fadeIn .3s var(--ease) both;
  }
  .modal-card .emoji{ font-size:2.6rem; margin-bottom:0.5rem; }
  .modal-card h3{ margin:0 0 0.35rem; font-size:1.05rem; color:var(--ink-900); }
  .modal-card p{ margin:0 0 1.1rem; font-size:0.85rem; color:var(--ink-500); line-height:1.5; }
  .modal-card .dismiss{
    margin-top:0.8rem; background:none; border:none; color:var(--ink-300);
    font-size:0.78rem; font-weight:700; text-decoration:underline; cursor:pointer;
  }

  .inbox-overlay{ align-items:flex-start; overflow-y:auto; }
  .inbox-card{
    max-width:460px; width:100%; text-align:left; padding:0;
    margin-top:2.2rem; margin-bottom:2.2rem;
  }
  .inbox-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.1rem 1.3rem; border-bottom:1px solid var(--border);
    background:var(--blue-50); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  }
  .inbox-head h3{ margin:0; font-size:0.85rem; font-weight:800; color:var(--blue-700); text-transform:uppercase; letter-spacing:0.04em; }
  .inbox-close{ background:none; border:none; font-size:1.6rem; line-height:1; color:var(--ink-300); cursor:pointer; }
  .inbox-body{ padding:1rem 1.3rem 1.3rem; display:flex; flex-direction:column; gap:0.8rem; }
  .inbox-item{
    border-left:3px solid var(--blue-500); background:var(--surface-soft);
    border-radius:12px; padding:0.85rem 1rem;
  }
  .inbox-item .row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem; gap:0.5rem; }
  .inbox-item .tag{ font-size:0.65rem; font-weight:800; color:var(--blue-700); background:var(--blue-100); padding:0.15rem 0.5rem; border-radius:8px; text-transform:uppercase; letter-spacing:0.03em; }
  .inbox-item .date{ font-size:0.68rem; color:var(--ink-300); font-weight:700; white-space:nowrap; }
  .inbox-item .msg{ font-size:0.83rem; color:var(--ink-700); line-height:1.5; }
  .inbox-item .msg a{ color:var(--blue-600); font-weight:700; }
  .inbox-empty{ text-align:center; color:var(--ink-300); font-size:0.85rem; padding:2.5rem 1rem; }

  /* footer */
  .site-footer{
    position:fixed; left:0; bottom:0; width:100%; z-index:40;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
  }
  .footer-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:center; gap:2.2rem;
  }
  .footer-icon{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%;
    color:#fff; transition:transform .15s var(--ease);
  }
  .footer-icon svg{ width:22px; height:22px; }
  .footer-icon.wa{ background:linear-gradient(135deg,#25d366,#1aa851); }
  .footer-icon.tg{ background:linear-gradient(135deg,#34b3f1,#1683c9); }
  .footer-icon:hover{ transform:translateY(-2px) scale(1.06); }

  body.has-footer .wrap{ padding-bottom:6.5rem; }

  @media (min-width:641px) and (max-width:900px){
    .brand-text p{ display:none; }
  }
</style>
<style id="cm-theme">
:root{
  --blue-50:#fff5ee; --blue-100:#ffe9dc; --blue-200:#ffd2b8; --blue-300:#ffb68e;
  --blue-500:#f2602a; --blue-600:#e0501c; --blue-700:#c23f10; --blue-900:#5a2208;
  --ink-900:#1a1412; --ink-700:#3d322c; --ink-500:#6f625a; --ink-300:#a2958b;
  --surface:#ffffff; --surface-soft:#faf5ef; --border:#eee4d8;
  --shadow-sm:0 1px 2px rgba(60,30,10,.05); --shadow-md:0 8px 22px rgba(90,40,10,.09); --shadow-lg:0 16px 40px rgba(90,40,10,.14);
}
body{ background:radial-gradient(900px 500px at 100% -10%, rgba(242,96,42,.10), transparent 60%), linear-gradient(180deg,#f7f1ea 0%,#f3ebe2 100%) !important; }
.site-header{ background:rgba(247,241,234,.9) !important; border-bottom:1px solid rgba(242,96,42,.14) !important; }
.brand-icon{ padding:0 !important; overflow:hidden; background:#fff !important; box-shadow:0 6px 16px rgba(194,63,16,.30) !important; border:2px solid #fff; border-radius:50% !important; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
.brand-icon img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
.folder-grid{ counter-reset:chap; gap:.8rem !important; }
.folder-card{ counter-increment:chap; border-radius:26px !important; border:1px solid var(--border) !important; box-shadow:0 1px 0 rgba(255,255,255,.8) inset, var(--shadow-sm) !important; }
.folder-card.open{ border-color:#e5d3c2 !important; box-shadow:var(--shadow-md) !important; }
.folder-header{ gap:1rem !important; padding:1.15rem 1.2rem !important; }
.folder-header:hover{ background:#fffaf5 !important; }
.folder-icon-wrap{ width:auto !important; height:auto !important; min-width:2.6rem; background:none !important; border-radius:0 !important; transform:none !important; font-size:0 !important; justify-content:flex-start !important; box-shadow:none !important; }
.folder-icon-wrap svg{ display:none !important; }

// ================================================================
// 4. PREP DATA (once) – precompute lowercase search keys & file
//    metadata so search + rendering never re-does this work.
// ================================================================
function getFileExt(title){
  const idx = title.lastIndexOf('.');
  return idx === -1 ? '' : title.slice(idx + 1).toLowerCase();
}

function getFileKind(ext){
  if (ext === 'pdf') return 'pdf';
  if (['mkv','mp4','mov','avi','webm','m4v'].indexOf(ext) !== -1) return 'video';
  return 'other';
}

// Strip the trailing file extension (e.g. ".pdf", ".mkv") for display only.
// The original title/url are kept untouched everywhere else.
function stripExtension(title){
  const idx = title.lastIndexOf('.');
  if (idx === -1) return title;
  return title.slice(0, idx).trim();
}

const folders = rawData.map(function(folder, folderIndex){
  const files = folder.files.map(function(file, fileIndex){
    const ext = getFileExt(file.title);
    const displayTitle = stripExtension(file.title);
    return {
      id: folderIndex + '-' + fileIndex,
      title: file.title,
      displayTitle: displayTitle,
      url: file.url,
      ext: ext,
      kind: getFileKind(ext),
      lower: displayTitle.toLowerCase()
    };
  });
  return {
    index: folderIndex,
    chapter: folder.chapter,
    lower: folder.chapter.toLowerCase(),
    files: files,
    fileCount: files.length,
    // lazy-render bookkeeping
    built: false,          // has the file-list DOM been built at least once?
    open: false,            // is the folder currently expanded?
    bodyEl: null,           // reference to .folder-body (set on card creation)
    listEl: null,           // reference to .file-list (set on first build)
    cardEl: null            // reference to .folder-card
  };
});

const TOTAL_FOLDERS = folders.length;
const TOTAL_FILES = folders.reduce(function(sum, f){ return sum + f.fileCount; }, 0);
statFoldersEl.textContent = TOTAL_FOLDERS;
statFilesEl.textContent = TOTAL_FILES;

// ================================================================
// 5. HELPERS
// ================================================================

// Escape a string for safe insertion as HTML text.
function escapeHTML(str){
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Wrap the matching substring of `text` in <mark> (case-insensitive).
// Falls back to escaped plain text when there is no query.
function highlight(text, query){
  const safe = escapeHTML(text);
  if (!query) return safe;
  const lowerText = text.toLowerCase();
  const idx = lowerText.indexOf(query);
  if (idx === -1) return safe;
  const before = escapeHTML(text.slice(0, idx));
  const match  = escapeHTML(text.slice(idx, idx + query.length));
  const after  = escapeHTML(text.slice(idx + query.length));
  return before + '<mark>' + match + '</mark>' + after;
}

// Lightweight ripple effect for tappable elements.
function spawnRipple(container, evt){
  const rect = container.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.6;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const x = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left - size / 2;
  const y = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top - size / 2;
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  container.appendChild(ripple);
  setTimeout(function(){ ripple.remove(); }, 600);
}

// Build a single file-item DOM node.
function createFileItemEl(file, query){
  const item = document.createElement('div');
  item.className = 'file-item';

  const icon = document.createElement('div');
  icon.className = 'file-icon ' + file.kind;
  icon.innerHTML = ICONS[file.kind];

  const name = document.createElement('div');
  name.className = 'file-name';
  name.innerHTML = highlight(file.displayTitle, query);
  name.title = file.displayTitle;

  const openBtn = document.createElement('a');
  openBtn.className = 'open-btn';
  openBtn.href = file.url;
  openBtn.target = '_blank';
  openBtn.rel = 'noopener';
  openBtn.innerHTML = '<span>Open</span>' + ICONS.external;
  openBtn.addEventListener('click', function(e){ e.stopPropagation(); });

  item.appendChild(icon);
  item.appendChild(name);
  item.appendChild(openBtn);
  return item;
}

// Render (or re-render) the file list of one folder into a fragment,
// optionally restricted to a filtered subset (used during search).
function populateFileList(folder, query, subsetFiles){
  const files = subsetFiles || folder.files;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < files.length; i++){
    frag.appendChild(createFileItemEl(files[i], query));
  }
  folder.listEl.innerHTML = '';
  folder.listEl.appendChild(frag);
  folder.built = true;
}

// Set a folder's open/closed visual state (with smooth max-height animation).
function setFolderOpen(folder, open, query, subsetFiles){
  folder.open = open;
  if (open){
    if (!folder.built || query !== undefined){
      populateFileList(folder, query, subsetFiles);
    }
    folder.cardEl.classList.add('open');
    // measure natural height for smooth transition
    folder.bodyEl.style.maxHeight = folder.bodyEl.scrollHeight + 'px';
  } else {
    folder.cardEl.classList.remove('open');
    folder.bodyEl.style.maxHeight = '0px';
  }
}

function toggleFolder(folder){
  setFolderOpen(folder, !folder.open);
}

// ================================================================
// 6. FOLDER CARD CREATION (shells only — files render lazily)
// ================================================================
function createFolderCardEl(folder){
  const card = document.createElement('div');
  card.className = 'folder-card';
  card.style.animationDelay = (Math.min(folder.index, 20) * 18) + 'ms';

  const header = document.createElement('div');
  header.className = 'folder-header';
  header.setAttribute('role', 'button');
  header.setAttribute('tabindex', '0');
  header.setAttribute('aria-expanded', 'false');

  const iconWrap = document.createElement('div');
  iconWrap.className = 'folder-icon-wrap';
  iconWrap.innerHTML = ICONS.folder;

  const titleBlock = document.createElement('div');
  titleBlock.className = 'folder-title-block';
  const titleEl = document.createElement('h3');
  titleEl.className = 'folder-title';
  titleEl.textContent = folder.chapter;
  const subEl = document.createElement('p');
  subEl.className = 'folder-sub';
  subEl.textContent = 'Chapter ' + (folder.index + 1);
  titleBlock.appendChild(titleEl);
  titleBlock.appendChild(subEl);

  const meta = document.createElement('div');
  meta.className = 'folder-meta';
  const badge = document.createElement('span');
  badge.className = 'file-count-badge';
  badge.textContent = folder.fileCount + (folder.fileCount === 1 ? ' file' : ' files');
  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.innerHTML = ICONS.chevron;
  meta.appendChild(badge);
  meta.appendChild(chevron);

  header.appendChild(iconWrap);
  header.appendChild(titleBlock);
  header.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'folder-body';
  const bodyInner = document.createElement('div');
  bodyInner.className = 'folder-body-inner';
  const list = document.createElement('div');
  list.className = 'file-list';
  bodyInner.appendChild(list);
  body.appendChild(bodyInner);

  card.appendChild(header);
  card.appendChild(body);

  // wire references for lazy rendering
  folder.cardEl = card;
  folder.bodyEl = body;
  folder.listEl = list;
  folder.titleEl = titleEl;
  folder.badgeEl = badge;

  // interaction: click/tap toggles; ripple for tactile feedback
  header.addEventListener('click', function(evt){
    spawnRipple(header, evt);
    toggleFolder(folder);
  });
  header.addEventListener('keydown', function(evt){
    if (evt.key === 'Enter' || evt.key === ' '){
      evt.preventDefault();
      toggleFolder(folder);
    }
  });

  return card;
}

// ================================================================
// 7. INITIAL RENDER – folder shells only (instant, no file DOM yet)
// ================================================================
function renderAllFolderShells(){
  const frag = document.createDocumentFragment();
  folders.forEach(function(folder){
    folder.cardEl = null; folder.bodyEl = null; folder.listEl = null; folder.built = false; folder.open = false;
    folder.titleEl = null;
    const card = createFolderCardEl(folder);
    card.classList.remove('hidden-card');
    frag.appendChild(card);
  });
  folderGridEl.innerHTML = '';
  folderGridEl.appendChild(frag);
  updateBreadcrumb('');
}

// ================================================================
// 8. SEARCH — instant, optimized, with highlighting + empty state
// ================================================================
let searchDebounceHandle = null;

function updateBreadcrumb(query){
  if (!query){
    breadcrumbEl.innerHTML = '<span class="crumb" id="crumbHome">All Chapters</span>';
    return;
  }
  breadcrumbEl.innerHTML =
    '<span class="crumb" id="crumbHome">All Chapters</span><span class="sep">›</span><span>Results for “' +
    escapeHTML(query) + '”</span>';
  const home = document.getElementById('crumbHome');
  if (home) home.addEventListener('click', clearSearch);
}

function renderEmptyState(){
  folderGridEl.innerHTML =
    '<div class="empty-state">' + ICONS.emptyBox +
    '<h3>No results found</h3>' +
    '<p>We couldn\'t find any chapter or file matching your search. Try a different keyword.</p>' +
    '</div>';
}

function applySearch(rawQuery){
  const query = rawQuery.trim().toLowerCase();
  clearBtnEl.classList.toggle('show', rawQuery.length > 0);
  updateBreadcrumb(query);

  if (!query){
    renderAllFolderShells();
    return;
  }

  let visibleFolderCount = 0;
  const frag = document.createDocumentFragment();

  folders.forEach(function(folder){
    folder.cardEl = null; folder.bodyEl = null; folder.listEl = null; folder.built = false; folder.open = false;
    folder.titleEl = null;

    const chapterMatches = folder.lower.indexOf(query) !== -1;
    const matchedFiles = chapterMatches
      ? folder.files
      : folder.files.filter(function(f){ return f.lower.indexOf(query) !== -1; });

    if (matchedFiles.length === 0) return;

    visibleFolderCount++;
    const card = createFolderCardEl(folder);
    // reflect highlighted chapter title
    folder.titleEl.innerHTML = highlight(folder.chapter, chapterMatches ? query : '');
    folder.badgeEl.textContent = matchedFiles.length + (matchedFiles.length === 1 ? ' match' : ' matches');
    frag.appendChild(card);

    // auto-expand folders that contain matches so results are visible immediately
    setFolderOpen(folder, true, query, matchedFiles);
  });

  folderGridEl.innerHTML = '';
  if (visibleFolderCount === 0){
    renderEmptyState();
    return;
  }
  folderGridEl.appendChild(frag);
}

function handleSearchInput(){
  const value = searchInputEl.value;
  clearBtnEl.classList.toggle('show', value.length > 0);
  if (searchDebounceHandle) clearTimeout(searchDebounceHandle);
  // tiny debounce keeps typing perfectly smooth even at thousands of files
  searchDebounceHandle = setTimeout(function(){ applySearch(value); }, 90);
}

function clearSearch(){
  searchInputEl.value = '';
  clearBtnEl.classList.remove('show');
  applySearch('');
  searchInputEl.focus();
}

// ================================================================
// 9. EXPAND ALL / COLLAPSE ALL
// ================================================================
function expandAll(){
  folders.forEach(function(folder){
    if (folder.cardEl) setFolderOpen(folder, true);
  });
}
function collapseAll(){
  folders.forEach(function(folder){
    if (folder.cardEl) setFolderOpen(folder, false);
  });
}

// ================================================================
// 10. EVENT WIRING
// ================================================================
searchInputEl.addEventListener('input', handleSearchInput);
clearBtnEl.addEventListener('click', clearSearch);
expandAllBtnEl.addEventListener('click', function(evt){ spawnRipple(expandAllBtnEl, evt); expandAll(); });
collapseAllBtnEl.addEventListener('click', function(evt){ spawnRipple(collapseAllBtnEl, evt); collapseAll(); });

// keep open folders' max-height correct on resize (font/line wraps can change height)
let resizeRaf = null;
window.addEventListener('resize', function(){
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(function(){
    folders.forEach(function(folder){
      if (folder.open && folder.bodyEl) folder.bodyEl.style.maxHeight = folder.bodyEl.scrollHeight + 'px';
    });
  });
});

// ================================================================
// 11. SOCIAL LINKS
// ================================================================
['tgTopBtn', 'tgFooterBtn'].forEach(function(id){
  const el = document.getElementById(id);
  if (el) el.href = TG_LINK;
});

// ================================================================
// 13. NOTIFICATION BELL + INBOX
// ================================================================
const NOTIFICATIONS = [
  {
    tag: 'WhatsApp',
    date: 'New',
    message: 'Updates ke liye hamara WhatsApp Channel join karo — <a href="' + TG_LINK + '" target="_blank" rel="noopener">tap here to open</a>.'
  }
];

const bellFabEl = document.getElementById('bellFab');
const bellDotEl = document.getElementById('bellDot');
const inboxModalEl = document.getElementById('inboxModal');
const inboxBodyEl = document.getElementById('inboxBody');
const inboxCloseBtnEl = document.getElementById('inboxCloseBtn');

function renderInbox(){
  if (NOTIFICATIONS.length === 0){
    inboxBodyEl.innerHTML = '<div class="inbox-empty">No new updates</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  NOTIFICATIONS.forEach(function(n){
    const item = document.createElement('div');
    item.className = 'inbox-item';
    item.innerHTML =
      '<div class="row"><span class="tag">' + escapeHTML(n.tag) + '</span><span class="date">' + escapeHTML(n.date) + '</span></div>' +
      '<div class="msg">' + n.message + '</div>';
    frag.appendChild(item);
  });
  inboxBodyEl.innerHTML = '';
  inboxBodyEl.appendChild(frag);
}

function openInbox(){
  renderInbox();
  inboxModalEl.classList.remove('hidden');
  bellDotEl.classList.add('hidden');
}
function closeInbox(){
  inboxModalEl.classList.add('hidden');
}

bellFabEl.addEventListener('click', openInbox);
inboxCloseBtnEl.addEventListener('click', closeInbox);
inboxModalEl.addEventListener('click', function(evt){
  if (evt.target === inboxModalEl) closeInbox();
});

if (NOTIFICATIONS.length > 0){
  bellDotEl.textContent = NOTIFICATIONS.length;
  bellDotEl.classList.remove('hidden');
}

// ================================================================
// 14. INITIAL PAINT
// ================================================================
renderAllFolderShells();

})();
</script>

<script id="cm-theme-js">
(function(){
  function tidy(root){
    (root||document).querySelectorAll('.folder-card').forEach(function(c){
      var tb=c.querySelector('.folder-title-block'), badge=c.querySelector('.file-count-badge');
      if(tb && badge && badge.parentNode!==tb){ tb.appendChild(badge); }
      if(badge && /^1 (items|files)$/.test(badge.textContent.trim())) badge.textContent='1 item';
      var t=c.querySelector('.folder-title');

    });
  }
  function start(){
    tidy();
    document.querySelectorAll('.folder-grid').forEach(function(g){
      new MutationObserver(function(){ tidy(g); }).observe(g,{childList:true,subtree:true});
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();

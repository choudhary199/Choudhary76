<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1ea">
<title>Banking · Choudhary Mehfil</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{margin:0;padding:0}
body{background:radial-gradient(900px 500px at 100% -10%,rgba(242,96,42,.12),transparent 60%),linear-gradient(180deg,#f7f1ea,#f3ebe2);color:#1a1412;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;padding:0 16px 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0}
.home{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #eee4d8;color:#3d322c;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 1px 2px rgba(60,30,10,.06)}
.dp{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid #fff;box-shadow:0 6px 16px rgba(194,63,16,.3);display:flex;align-items:center;justify-content:center;font-size:20px}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
header{text-align:center;padding:26px 0 18px}
.badge{display:inline-block;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#c23f10;background:#ffe9dc;border:1px solid #ffd2b8;padding:7px 13px;border-radius:999px;margin-bottom:14px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
h1 span{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#f2602a}
.sub{margin-top:8px;color:#8a7d73;font-size:13.5px}
#q{width:100%;margin:6px 0 18px;height:50px;border-radius:999px;border:1.5px solid #eee4d8;background:#fff;color:#1a1412;font-size:14px;padding:0 20px;outline:none}
#q:focus{border-color:#f2602a;box-shadow:0 0 0 4px rgba(242,96,42,.12)}
.list{display:flex;flex-direction:column;gap:.8rem;counter-reset:t}
.row{counter-increment:t;display:flex;align-items:center;gap:1rem;padding:1.15rem 1.2rem;border-radius:26px;background:#fff;border:1px solid #eee4d8;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(60,30,10,.05);transition:.2s}
.row:active{transform:scale(.985)}
.num::before{content:counter(t,decimal-leading-zero);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:2.1rem;line-height:1;color:#f2602a;letter-spacing:-.03em}
.num{min-width:2.8rem}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.t{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.m{font-size:.85rem;color:#9d9088}
.arr{width:46px;height:46px;border-radius:50%;background:#f2ece5;color:#3d322c;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.25s}
.row:hover .arr,.row:active .arr{background:#1a1412;color:#fff}
.empty{display:none;text-align:center;color:#8a7d73;padding:40px 0;font-size:13px}
.join{text-align:center;padding:30px 0 6px}
.join a{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(180deg,#34d399,#10b981);color:#03261c;font:800 15px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-decoration:none;box-shadow:0 10px 24px -8px rgba(16,185,129,.7)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html" id="homeBtn">&#8592; Home</a>
    <div class="dp"><img src="channel-dp.jpg" alt="" onerror="this.parentNode.textContent='C'"></div>
  </div>
  <header>
    <div class="badge">BANKING SECTION</div>
    <h1>Banking <span>Batches</span></h1>
    <p class="sub">Apna batch chuno aur padhai shuru karo</p>
  </header>
  <input id="q" type="text" placeholder="Batch search..." autocomplete="off" spellcheck="false">
  <div class="list" id="list">
    <a class="row" href="banking-spl-40-cw.html">
      <span class="num"></span>
      <span class="txt"><span class="t">𝑩𝒂𝒏𝒌𝒊𝒏𝒈 𝑺𝑷𝑳-40 𝑪𝑾</span><span class="m">English · Reasoning · Maths · GA · Computer</span></span>
      <span class="arr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </div>
  <div class="empty" id="empty">Koi batch nahi mila</div>
  <div class="join"><a href="https://whatsapp.com/channel/0029VbBqYvh2phHSBhGVGD08" target="_blank" rel="noopener">&#128172; 𝕁𝕠𝕚𝕟 𝕎𝕙𝕒𝕥𝕤𝕒𝕡𝕡 ℂ𝕙𝕒𝕟𝕟𝕖𝕝</a></div>
</div>
<script>
(function(){
  var q=document.getElementById('q'),rows=[].slice.call(document.querySelectorAll('.row')),e=document.getElementById('empty');
  q.addEventListener('input',function(){
    var v=q.value.trim().toLowerCase(),n=0;
    rows.forEach(function(r){var ok=r.textContent.toLowerCase().indexOf(v)>-1;r.style.display=ok?'':'none';if(ok)n++;});
    e.style.display=n?'none':'block';
  });
})();
</script>
</body>
</html>
